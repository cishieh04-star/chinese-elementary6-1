<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跑道闖關樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 版面：一個畫面一件事，全部在一個螢幕內，不需要往下滑。四種介面主題各自一套顏色。 */
:root{
  --bg:#3f9a5c; --onbg:#12324a; --panel:#fffaf0; --ink:#2b1d10; --muted:#7a6550;
  --accent:#d9472b; --accent2:#f5c339; --accent3:#2f6fd6; --ok:#25a55f; --off:#a9a9a9;
  --font:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  --skinbg: repeating-linear-gradient(180deg,transparent 0 34px,rgba(255,255,255,.55) 34px 37px) bottom/100% 36% no-repeat,
            linear-gradient(180deg,#9fdcf7 0,#cdeefa 20%,#5cbc76 20%,#3f9a5c 64%,#d4552f 64%,#c44a26 100%);
  color-scheme: light;
}
body[data-skin="space"]{--bg:#161d44;--onbg:#ffffff;--panel:#252f68;--ink:#f6f3ff;--muted:#bdbbe6;--accent:#ff8f3f;--accent2:#7fe0ff;--accent3:#c58bff;--ok:#3fd38a;--off:#596084;
  --skinbg: radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 78% 12%,#fff 50%,transparent 51%),radial-gradient(3px 3px at 52% 40%,#ffe9a8 50%,transparent 51%),radial-gradient(2px 2px at 28% 72%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 88% 66%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 64% 86%,#cfe9ff 50%,transparent 51%),radial-gradient(120px 120px at 92% 92%,#ff9a52 0,#e0602a 60%,transparent 62%),linear-gradient(180deg,#0d1231,#2a2563);}
body[data-skin="ocean"]{--bg:#0b5d86;--onbg:#ffffff;--panel:#effcff;--ink:#073047;--muted:#3d6a80;--accent:#ff6f4f;--accent2:#ffd34d;--accent3:#19a37a;--ok:#16a86a;--off:#9fb6c0;
  --skinbg: radial-gradient(18px 18px at 10% 80%,rgba(255,255,255,.35) 40%,transparent 45%),radial-gradient(12px 12px at 85% 30%,rgba(255,255,255,.35) 40%,transparent 45%),radial-gradient(26px 26px at 70% 75%,rgba(255,255,255,.25) 40%,transparent 45%),radial-gradient(10px 10px at 30% 20%,rgba(255,255,255,.35) 40%,transparent 45%),linear-gradient(180deg,#27b8d8 0,#0f7aa6 45%,#08446b 100%);}
body[data-skin="candy"]{--bg:#ffd6e7;--onbg:#5b1d3c;--panel:#fffaf3;--ink:#5b1d3c;--muted:#9a5a78;--accent:#f2457f;--accent2:#6fd08c;--accent3:#8a6cf0;--ok:#25a55f;--off:#c9b3bd;
  --skinbg: radial-gradient(circle,#fff 3px,transparent 4px) 0 0/28px 28px, radial-gradient(circle,#ffb3cf 3px,transparent 4px) 14px 14px/28px 28px, linear-gradient(180deg,#ffe3ef,#ffc9de);}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;background:var(--skinbg);background-color:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:.45em .8em;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:15px;line-height:1.2;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--accent);color:#fff}
.btn.big{font-size:clamp(18px,4.6vw,26px);padding:.55em 1.1em;border-radius:18px}
.btn:focus-visible,.node:focus-visible{outline:4px solid var(--accent2);outline-offset:2px}

/* ---------- 開始畫面 ---------- */
#start{align-items:center;justify-content:center;text-align:center;gap:10px;overflow-y:auto}
#start h1{margin:0;font-size:clamp(30px,8vw,54px);color:var(--onbg);letter-spacing:.06em;text-shadow:0 3px 0 rgba(255,255,255,.35)}
#start .sub{color:var(--onbg);font-size:clamp(16px,4vw,22px);opacity:.9}
.startCard{background:var(--panel);border-radius:22px;padding:12px 14px;width:min(520px,100%);display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.startCard .lb{font-size:clamp(17px,4.4vw,22px);color:var(--ink)}
.startCard input[type=text]{width:100%;font-size:clamp(20px,5.4vw,28px);text-align:center;border:3px solid var(--accent2)}
.avs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.av{border:3px solid var(--accent2);background:#fff;border-radius:16px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;color:var(--ink);font-size:14px}
.av span{font-size:clamp(30px,min(9vw,6vh),48px);line-height:1.15}
.av.on{background:var(--accent2);outline:4px solid var(--accent);transform:scale(1.06)}
.oldp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.oldp button{border:2px solid var(--accent3);background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px;font-size:15px}
.hop{font-size:clamp(50px,14vw,72px);line-height:1;animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-14px)}}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(560px,100%)}
.skin{border:4px solid rgba(255,255,255,.9);border-radius:22px;padding:14px 8px;min-height:clamp(96px,17vh,150px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:clamp(18px,4.6vw,24px);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.skin .em{font-size:clamp(36px,9vw,56px);line-height:1}
.skin.track{background:linear-gradient(180deg,#8fd3f5 0 35%,#4caf68 35% 70%,#d4552f 70%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.skin.space{background:radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 70% 60%,#fff 50%,transparent 51%),linear-gradient(#0d1231,#3a2f80)}
.skin.ocean{background:linear-gradient(#27b8d8,#08446b)}
.skin.candy{background:radial-gradient(circle,#fff 3px,transparent 4px) 0 0/22px 22px,linear-gradient(#ff8fb8,#f2457f)}
.skin.on{outline:5px solid #ffe14a;outline-offset:2px}
.linebar{background:#fff3c4;color:#5a3b00;border-radius:14px;padding:10px 12px;font-size:15px;max-width:560px}
.linebar a{display:inline-block;margin-top:6px;background:#06c755;color:#fff;border-radius:12px;padding:8px 12px;text-decoration:none}

/* ---------- 首頁地圖 ---------- */
.homeHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.homeHead h1{margin:0;font-size:clamp(22px,5.6vw,34px);color:var(--onbg);flex:1 1 260px;min-width:0;text-shadow:0 2px 0 rgba(255,255,255,.25)}
.homeHead h1 small{display:block;font-size:.5em;opacity:.85;letter-spacing:.05em}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#map{flex:1;min-height:0;position:relative;display:grid;gap:4px}
#mapPath{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--onbg);padding:0;min-width:0}
.node .ball{width:clamp(48px,min(15vw,10.5vh),88px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(24px,min(7.5vw,5.4vh),44px);background:var(--panel);border:4px solid var(--accent2);box-shadow:0 5px 0 rgba(0,0,0,.25);position:relative}
.node .num{position:absolute;top:-6px;left:-6px;background:var(--accent);color:#fff;border-radius:999px;font-size:13px;min-width:24px;height:24px;display:grid;place-items:center;border:2px solid #fff}
.node .nm{font-size:clamp(13px,3.4vw,17px);background:var(--panel);color:var(--ink);border-radius:10px;padding:1px 7px;white-space:nowrap}
.node .st{font-size:clamp(12px,3vw,16px);color:#ffcc00;text-shadow:0 1px 0 #000;letter-spacing:1px;line-height:1}
.node .st i{color:rgba(255,255,255,.55);font-style:normal}
.node.done .ball{border-color:var(--ok)}
.node.next .ball{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(255,225,74,.55)}}
.homeFoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- 遊戲畫面 ---------- */
.gTop{display:flex;align-items:center;gap:8px}
.gTop h2{margin:0;flex:1;min-width:0;text-align:center;font-size:clamp(18px,4.8vw,26px);color:var(--onbg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tools .btn{font-size:14px;padding:.4em .65em}
.prog{display:flex;gap:6px;justify-content:center;min-height:12px}
.prog i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(0,0,0,.15)}
.prog i.d{background:var(--accent2)}
.prog i.c{background:var(--accent);transform:scale(1.25)}
.hint{text-align:center;color:var(--onbg);font-size:clamp(14px,3.6vw,17px);opacity:.95;min-height:1.2em}
#stageTop:empty{display:none}
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden}
#qbox{background:var(--panel);color:var(--ink);border-radius:20px;padding:12px 14px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.2);flex-shrink:0}
#qbox:empty{display:none}
.qword{font-size:clamp(34px,min(10vw,7.5vh),64px);letter-spacing:.12em;line-height:1.2}
.qword b{color:var(--accent);text-decoration:underline;text-underline-offset:6px}
.qsub{font-size:clamp(18px,min(4.8vw,3.6vh),28px);line-height:1.4}
.qquote{font-size:clamp(20px,min(5.4vw,4vh),32px);line-height:1.5;text-wrap:balance}
.blank{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--accent);color:var(--accent);margin:0 2px}
#ans{flex:1;min-height:170px;position:relative;display:flex;flex-direction:column}
.moreHint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);background:#ffe14a;color:#4a3300;border-radius:999px;padding:6px 14px;font-size:15px;z-index:40;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:bounce 1s infinite;pointer-events:none}
@keyframes bounce{50%{transform:translate(-50%,-6px)}}

/* 選項：大按鈕 */
.cards{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;flex:1}
.cards.one{grid-template-columns:minmax(0,1fr)}
.card{border:0;border-radius:18px;background:var(--panel);color:var(--ink);font-size:clamp(20px,min(5.6vw,4.4vh),34px);padding:14px 10px;min-height:clamp(64px,12vh,110px);box-shadow:0 6px 0 var(--accent2);line-height:1.3;border:3px solid var(--accent2)}
.cards.one .card{font-size:clamp(18px,min(4.8vw,3.6vh),28px);min-height:56px}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent2)}

/* 選項：摩天輪 */
.wheel{position:relative;margin:0 auto;flex-shrink:0}
.wframe{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gondola{position:absolute;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.gondola .hook{width:4px;height:12px;background:var(--onbg);opacity:.8}
.gondola .cab{display:block;width:100%;border-radius:14px 14px 18px 18px;padding:10px 4px 12px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.9);line-height:1.15;white-space:nowrap}
.gondola.c0 .cab,.prize.c0,.balloon.c0{background:#e94b4b}
.gondola.c1 .cab,.prize.c1,.balloon.c1{background:#2f7fe0}
.gondola.c2 .cab,.prize.c2,.balloon.c2{background:#f0a020}
.gondola.c3 .cab,.prize.c3,.balloon.c3{background:#2fb070}

/* 選項：夾娃娃機 */
.claw-m{flex:1;display:flex;flex-direction:column;background:var(--accent);border-radius:22px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:640px;width:100%;margin:0 auto;min-height:220px}
.claw-top{color:#fff;text-align:center;font-size:16px;letter-spacing:.2em;padding-bottom:4px}
.claw-glass{flex:1;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(220,240,255,.92));border-radius:14px;overflow:hidden;border:4px solid rgba(255,255,255,.7)}
.claw-glass::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:#777}
.claw{position:absolute;top:8px;left:50%;transform:translateX(-50%);transition:left .55s ease;z-index:3;display:flex;flex-direction:column;align-items:center}
.claw .rope{width:4px;height:16px;background:#555;transition:height .55s ease}
.claw .head{width:46px;height:30px;position:relative}
.claw .head::before{content:"";position:absolute;left:10px;right:10px;top:0;height:12px;background:#666;border-radius:4px}
.claw .head i{position:absolute;top:8px;width:6px;height:24px;background:#555;border-radius:3px;transition:transform .25s}
.claw .head i.l{left:8px;transform:rotate(25deg);transform-origin:top}
.claw .head i.r{right:8px;transform:rotate(-25deg);transform-origin:top}
.claw.grab .head i.l{transform:rotate(-8deg)}
.claw.grab .head i.r{transform:rotate(8deg)}
.prizes{position:absolute;left:25%;right:3%;top:36%;bottom:5%;display:grid;gap:10px;align-content:end;justify-items:center}
.prize{border:3px solid #fff;border-radius:999px;color:#fff;font-size:clamp(18px,min(5vw,4vh),30px);padding:.45em .7em;min-width:70%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.2);white-space:nowrap;position:relative;z-index:2}
.chute{position:absolute;left:3%;bottom:0;width:19%;height:34%;background:#3b3b3b;border-radius:10px 10px 0 0;color:#fff;display:grid;place-items:center;font-size:14px;z-index:1}

/* 選項：氣球 */
.balloons{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:14px 10px}
.balloon{border:0;width:clamp(112px,29vw,180px);aspect-ratio:.86;max-height:30vh;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;color:#fff;font-size:clamp(17px,min(4.4vw,3.4vh),26px);padding:8px;position:relative;box-shadow:inset -10px -12px 0 rgba(0,0,0,.14),inset 8px 8px 0 rgba(255,255,255,.25);animation:bob 3s ease-in-out infinite;line-height:1.25}
.balloon::after{content:"";position:absolute;left:50%;bottom:-18px;width:2px;height:18px;background:rgba(0,0,0,.35)}
.balloon:nth-child(2){animation-delay:-1s}.balloon:nth-child(3){animation-delay:-2s}.balloon:nth-child(4){animation-delay:-.5s}
@keyframes bob{50%{transform:translateY(-10px)}}
.balloon.popped{animation:popb .35s forwards}
@keyframes popb{60%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}

/* 共用狀態 */
.off{filter:grayscale(1);opacity:.45}
.ok{outline:5px solid var(--ok);outline-offset:3px}
.reveal{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,225,74,.85)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* 第1關：翻牌 */
.flipgrid{flex:1;display:grid;gap:8px}
.fcard{border:0;padding:0;background:none;perspective:600px;min-height:0}
.fcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fcard.open .in,.fcard.matched .in{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.fcard .back{background:var(--accent);color:#fff;font-size:clamp(26px,7vw,40px);border:3px solid rgba(255,255,255,.8)}
.fcard .front{background:var(--panel);color:var(--ink);transform:rotateY(180deg);font-size:clamp(28px,min(9vw,6vh),54px);border:3px solid var(--accent2)}
.fcard .front.zy{font-size:clamp(20px,min(6vw,4.4vh),36px);color:var(--accent3)}
.fcard.matched .front{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--panel))}

/* 第3關：打地鼠 */
.moles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 0}
.mole{border:0;width:clamp(44px,min(12vw,9vh),70px);aspect-ratio:1;border-radius:50% 50% 14px 14px;background:linear-gradient(180deg,#b9875a,#8a5a33);color:#fff;font-size:clamp(24px,min(7vw,5.4vh),40px);box-shadow:0 6px 0 #5a3a1e;position:relative}
.mole.hit{background:linear-gradient(180deg,#ff7b6b,#d9472b);animation:whack .4s}
.mole.fixed{background:linear-gradient(180deg,#4fd08a,#1f9a58)}
.mole.hint{animation:glow 1s infinite}
@keyframes whack{30%{transform:scaleY(.6) translateY(10px)}}
.fixzone{flex:1;display:flex;flex-direction:column;min-height:150px}

/* 第4關：部首合體 */
.eq{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(34px,min(10vw,7vh),60px)}
.eq .bx{min-width:1.4em;height:1.4em;border-radius:14px;display:grid;place-items:center;background:var(--bg);color:var(--onbg);border:3px dashed var(--accent)}
.eq .bx.fill{border-style:solid;background:var(--accent2);color:#3a2a00}
.eq .res.pop{animation:popin .6s}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.3)}}
.rad{display:flex;flex-direction:column;align-items:center;gap:2px}
.rad b{font-size:1.5em;font-weight:normal}
.rad small{font-size:.55em;opacity:.8}

/* 第5關：接力 */
.track{position:relative;height:clamp(56px,10vh,80px);background:repeating-linear-gradient(180deg,#d4552f 0 30%,#fff 30% 34%) ;border-radius:14px;border:3px solid #fff;flex-shrink:0;overflow:hidden}
.track .mk{position:absolute;top:0;bottom:0;width:3px;background:rgba(255,255,255,.8)}
.track .fin{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(180deg,#000 0 8px,#fff 8px 16px)}
.runner{position:absolute;bottom:4px;font-size:clamp(34px,7vh,52px);transition:left 1s cubic-bezier(.3,.7,.4,1);transform:scaleX(-1);line-height:1}
.baton{position:absolute;top:4px;font-size:14px;color:#fff;background:rgba(0,0,0,.35);border-radius:8px;padding:1px 6px;transition:left 1s}

/* 第7關：句子火車 */
.train{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:54px}
.train .loco{font-size:36px}
.car{background:var(--accent3);color:#fff;border-radius:10px 10px 4px 4px;padding:8px 10px;font-size:clamp(17px,min(4.6vw,3.4vh),24px);position:relative;animation:popin .4s}
.car::after{content:"● ●";position:absolute;left:0;right:0;bottom:-12px;font-size:10px;color:#333;text-align:center}
.bank{flex:1;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center}
.piece{border:3px solid var(--accent2);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:clamp(18px,min(5vw,3.8vh),28px);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.piece.used{visibility:hidden}

/* 第8關：配對 */
.pairs{flex:1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 12px;align-content:center}
.pcol{display:flex;flex-direction:column;gap:8px}
.pbtn{border:3px solid var(--accent2);background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 8px;font-size:clamp(16px,min(4.4vw,3.2vh),24px);min-height:clamp(44px,8vh,64px);box-shadow:0 4px 0 rgba(0,0,0,.2);line-height:1.25}

/* ================== 語音 ================== */
const synth=window.speechSynthesis;let seqId=0,spokeOK=false;
function clean(t){return String(t).replace(/＿+/g,'什麼').replace(/□/g,'什麼').replace(/[「」『』]/g,'').replace(/……/g,'，').trim();}
function speak(text){return new Promise(res=>{
  if(!synth){res();return;}
  const c=clean(text);if(!c){res();return;}
  try{synth.cancel();}catch(e){}
  let done=false;const fin=()=>{if(!done){done=true;res();}};
  const u=new SpeechSynthesisUtterance(c);u.lang='zh-TW';u.rate=S.rate;u.onend=fin;u.onerror=fin;u.onstart=()=>{spokeOK=true;};
  setTimeout(fin,1500+c.length*380/S.rate);
  setTimeout(()=>{try{synth.speak(u);}catch(e){fin();}},60);
});}
function stopSpeech(){seqId++;try{synth&&synth.cancel();}catch(e){}}
async function speakSeq(parts){stopSpeech();const my=seqId;for(const p of parts){if(my!==seqId)return;await speak(p);if(my!==seqId)return;await new Promise(r=>setTimeout(r,280));}}

/* ================== 音效與慶祝 ================== */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,d,type='triangle',vol=.16){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
function noise(t0,d,vol=.12){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1500+Math.random()*1500;s.buffer=b;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0);}
const SFX={
 ok(){const sets=[[523,659,784],[587,740,880,1175],[659,784,988,1319],[523,784,1047],[392,523,659,784]];rnd(sets).forEach((f,i)=>tone(f,i*.08,.28));},
 bad(){tone(240,0,.16,'sine',.12);tone(190,.14,.26,'sine',.1);},
 pop(){tone(880,0,.07,'square',.05);tone(1320,.04,.06,'square',.04);},
 whack(){noise(0,.12,.25);tone(140,0,.15,'sine',.2);},
 clap(){for(let i=0;i<14;i++)noise(i*.07+Math.random()*.03,.05,.1);},
 fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.13,i===5?.7:.2,'triangle',.18));},
 boom(){noise(0,.5,.3);tone(80,0,.5,'sine',.25);}
};
const fx=$('#fx'),ctx=fx.getContext('2d');let parts=[],fxOn=false;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
sizeFx();addEventListener('resize',sizeFx);
const COLS=['#ff4d4d','#ffc400','#2f9bff','#2fd07a','#c86bff','#ff8a3d','#ffffff'];
function burst(x,y,n=40,spread=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*6)*spread;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:60+Math.random()*40,c:rnd(COLS),s:4+Math.random()*6,r:Math.random()*6});}if(!fxOn){fxOn=true;requestAnimationFrame(loopFx);}}
function loopFx(){ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;p.life--;p.r+=.1;ctx.save();ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.c;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});if(parts.length)requestAnimationFrame(loopFx);else{fxOn=false;ctx.clearRect(0,0,innerWidth,innerHeight);}}
function fireworks(times=5){for(let i=0;i<times;i++)setTimeout(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),60,1.2);tone(300+Math.random()*500,0,.3,'sine',.06);},i*350);}
function popWord(t){const d=document.createElement('div');d.className='word';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
function cheer(el){let x=innerWidth/2,y=innerHeight/2;if(el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();if(r.width){x=r.left+r.width/2;y=r.top+r.height/2;}}
  SFX.ok();burst(x,y,45);popWord(rnd(WORDS));if(Math.random()<.35)setTimeout(SFX.clap,250);G.stars++;$('#gStars').textContent=AV()+' ⭐ '+G.stars;}

/* 統一題目格式：opts[0]為正確答案，打亂後記住答案位置 */
function mkQ(html,say,opts,exp,keep){const arr=opts.map((o,i)=>Object.assign({},o,{c:i===0}));const sh=keep?arr:shuffle(arr);return{html,say,opts:sh,ans:sh.findIndex(o=>o.c),exp};}
const charOpt=c=>({t:c,s:DESC[c]||c});
function qZy(z){const[w,ch,...zs]=z;return mkQ('<div class="qword">'+w.replace(ch,'<b>'+ch+'</b>')+'</div><div class="qsub">「'+ch+'」怎麼唸？</div>',w+'的'+ch+'，怎麼唸？',zs.map(x=>({t:x,s:SAY[x]||x})),'');}
function qRelay(r){return mkQ('<div class="qword">'+r.w.replace('□','<span class="blank">？</span>')+'</div><div class="qsub">意思：'+r.m+'</div>',r.w+'，意思是'+r.m+'。要選哪一個字？',r.o.map(charOpt),'是'+r.w.replace('□',r.a));}
function qEmo(e){const opts=[EMO[e.a],...EMO.filter((x,i)=>i!==e.a)].map(t=>({t,s:t}));const q=mkQ('<div class="qquote">'+e.s+'</div><div class="qsub" style="color:var(--muted)">用什麼方法寫出心情？</div>',e.s+'。這句話用什麼方法寫出心情？',opts,e.x,true);
  const order=EMO.map(t=>q.opts.find(o=>o.t===t));q.opts=order;q.ans=order.findIndex(o=>o.c);return q;}

  const opts=f.o.map((t,i)=>({t,s:f.say?f.say[i]:([...t].length===1?(DESC[t]||t):t)}));

/* ================== 選項元件（摩天輪／夾娃娃機／大按鈕／氣球） ================== */
function choices(host,q,cb,opt={}){
  host.innerHTML='';const items=q.opts,ans=q.ans,maxTries=opt.maxTries||2;
  let style=opt.style||S.style;const maxLen=Math.max(...items.map(i=>[...i.t].length));
  if(style==='wheel'&&(maxLen>5||items.length>4))style='card';
  if(style==='claw'&&maxLen>6)style='card';
  if(style==='balloon'&&maxLen>10)style='card';
  const ctl={locked:false,tries:0,done:false,els:[],style};
  const handle=i=>{const el=ctl.els[i];if(ctl.locked||ctl.done||el.classList.contains('off'))return;stopSpeech();ctl.locked=true;const right=i===ans;
    const fin=()=>{if(right){ctl.done=true;el.classList.add('ok');cb(true,ctl.tries,el);}
      else{ctl.tries++;el.classList.add('off');shake(el);if(ctl.tries>=maxTries){ctl.done=true;ctl.els[ans].classList.add('reveal');cb(false,ctl.tries,ctl.els[ans]);}else{later(()=>{ctl.locked=false;},900);cb(null,ctl.tries,el);}}};
    if(style==='claw')clawGrab(ctl,el,right,fin);else if(style==='balloon'&&right){el.classList.add('popped');SFX.pop();fin();}else fin();};
  if(style==='wheel')buildWheel(host,items,ctl,handle,maxLen);
  else if(style==='claw')buildClaw(host,items,ctl,handle);
  else if(style==='balloon'){const w=document.createElement('div');w.className='balloons';host.appendChild(w);items.forEach((it,i)=>{const b=document.createElement('button');b.className='balloon c'+(i%4);b.textContent=it.t;b.onclick=()=>handle(i);w.appendChild(b);ctl.els.push(b);});}
  else{const w=document.createElement('div');w.className='cards'+(maxLen>7?' one':'');host.appendChild(w);items.forEach((it,i)=>{const b=document.createElement('button');b.className='card';b.textContent=it.t;b.onclick=()=>handle(i);w.appendChild(b);ctl.els.push(b);});}
  return ctl;
}
function buildWheel(host,items,ctl,handle,maxLen){
  const w=document.createElement('div');w.className='wheel';host.appendChild(w);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','wframe');w.appendChild(svg);
  const n=items.length;
  const gs=items.map((it,i)=>{const g=document.createElement('button');g.className='gondola c'+(i%4);g.innerHTML='<span class="hook"></span><span class="cab">'+esc(it.t)+'</span>';g.onclick=()=>handle(i);w.appendChild(g);ctl.els.push(g);return g;});
  let a=-Math.PI/2-Math.PI/n,last=performance.now(),alive=true;
  const frame=t=>{if(!alive)return;const dt=Math.min(.05,(t-last)/1000);last=t;if(!ctl.locked&&!ctl.done)a+=dt*.16;
    const W=host.clientWidth||300,H=host.clientHeight||300;const size=Math.max(220,Math.min(W,H*1.1));const hh=Math.max(200,Math.min(H,size));
    w.style.width=size+'px';w.style.height=hh+'px';const cx=size/2,cy=hh*.4,R=Math.min(size*.33,hh*.33);const gw=Math.max(72,size*.27);
    svg.setAttribute('viewBox','0 0 '+size+' '+hh);
    let s='<g stroke="currentColor" stroke-linecap="round" fill="none" style="color:var(--onbg);opacity:.85"><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx-R*.8)+'" y2="'+hh+'" stroke-width="8"/><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*.8)+'" y2="'+hh+'" stroke-width="8"/><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" stroke-width="6"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(R*.62)+'" stroke-width="3" stroke-dasharray="6 8"/>';
    gs.forEach((g,i)=>{const an=a+i*2*Math.PI/n;const x=cx+R*Math.cos(an),y=cy+R*Math.sin(an);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke-width="3"/>';
      g.style.width=gw+'px';g.style.left=(x-gw/2)+'px';g.style.top=y+'px';g.style.fontSize=Math.min(gw*.3,gw/(maxLen+.8))+'px';});
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="currentColor"/></g>';svg.innerHTML=s;requestAnimationFrame(frame);};
  requestAnimationFrame(frame);G.anims.push(()=>{alive=false;});
}
function buildClaw(host,items,ctl,handle){
  const m=document.createElement('div');m.className='claw-m';
  m.innerHTML='<div class="claw-top">夾 娃 娃 機</div><div class="claw-glass"><div class="claw"><div class="rope"></div><div class="head"><i class="l"></i><i class="r"></i></div></div><div class="prizes"></div><div class="chute">出口</div></div>';
  host.appendChild(m);const pz=m.querySelector('.prizes');const n=items.length;pz.style.gridTemplateColumns='repeat('+(n<=3?1:2)+',minmax(0,1fr))';
  items.forEach((it,i)=>{const b=document.createElement('button');b.className='prize c'+(i%4);b.textContent=it.t;b.onclick=()=>handle(i);pz.appendChild(b);ctl.els.push(b);});
  ctl.glass=m.querySelector('.claw-glass');ctl.claw=m.querySelector('.claw');ctl.rope=m.querySelector('.rope');ctl.chute=m.querySelector('.chute');
}
function clawGrab(ctl,el,right,fin){
  const gr=ctl.glass.getBoundingClientRect(),er=el.getBoundingClientRect(),cr=ctl.chute.getBoundingClientRect();
  const x=er.left+er.width/2-gr.left,cxp=cr.left+cr.width/2-gr.left;const rope=Math.max(16,er.top-gr.top+14-8-30);
  ctl.claw.style.left=x+'px';
  later(()=>{ctl.rope.style.height=rope+'px';},560);
  later(()=>{ctl.claw.classList.add('grab');SFX.pop();},1150);
  later(()=>{
    if(right){const up=rope-16;ctl.rope.style.height='16px';el.style.transition='transform .55s ease';el.style.transform='translateY('+(-up)+'px)';
      later(()=>{ctl.claw.style.left=cxp+'px';el.style.transform='translate('+(cxp-x)+'px,'+(-up)+'px)';},600);
      later(()=>{ctl.claw.classList.remove('grab');el.style.transition='transform .45s ease-in,opacity .45s';el.style.transform='translate('+(cxp-x)+'px,'+(cr.top-er.top+20)+'px) scale(.4)';el.style.opacity='0';},1200);
      later(()=>{fin();ctl.claw.style.left='50%';},1500);
    }else{const up=(rope-16)*.5;ctl.rope.style.height=(rope-up)+'px';el.style.transition='transform .5s ease';el.style.transform='translateY('+(-up)+'px)';
      later(()=>{ctl.claw.classList.remove('grab');el.style.transition='transform .4s cubic-bezier(.5,0,1,1)';el.style.transform='none';},600);
      later(()=>{ctl.rope.style.height='16px';ctl.claw.style.left='50%';fin();},1050);}
  },1500);
}

/* ================== 一般選擇題流程 ================== */
function runChoice(qs,hk={}){
  let i=0;
  const step=()=>{
    if(i>=qs.length){hk.end?hk.end():finishStage();return;}
    const q=qs[i],tk=G.token;clearAnims();setProgress(i,qs.length);
    $('#qbox').innerHTML=q.html;hk.show&&hk.show(q,i);
    G.readNow=()=>speakSeq([q.say,...q.opts.map(o=>o.s)]);
    choices($('#ans'),q,(res,tries,el)=>{
      if(res===true){cheer(el);if(tries>0)G.mistakes++;hk.correct&&hk.correct(q,i,el);later(()=>{i++;step();},hk.delay||1500);}
      else if(res===null){SFX.bad();speak(rnd(TRY));}
      else{SFX.bad();G.mistakes++;hk.fail&&hk.fail(q,i);
        speak('答案是：'+q.opts[q.ans].s+(q.exp?'。'+q.exp:'')).then(()=>{if(tk!==G.token)return;later(()=>{i++;step();},700);});}
    },hk.opt||{});
    if(S.voice||G.introText){const parts=readParts([q.say,...q.opts.map(o=>o.s)]);later(()=>speakSeq(parts),250);}
    checkFit();
  };
  step();
}

/* ================== 結算 ================== */
function finishStage(customStars){
  const m=G.mistakes;const st=customStars||(m===0?3:m<=2?2:1);const i=G.stage;
  const p=P();const old=p.lv[i]||{s:0,n:0};p.lv[i]={s:Math.max(old.s,st),n:old.n+1,d:new Date().toISOString().slice(0,10)};saveR();
  SFX.fanfare();setTimeout(SFX.clap,700);fireworks(6);
  const last=i>=STAGES.length-1;
  const msg=st===3?'滿分過關！':st===2?'很棒，過關了！':'過關了！再玩一次可以拿更多星星。';
  overlay('<div class="hop">'+AV()+'</div><h3>第'+(i+1)+'關　過關！</h3><div class="bigstars">'+[0,1,2].map(k=>'<span class="'+(k<st?'y':'')+'" style="animation-delay:'+(k*.35)+'s">★</span>').join('')+'</div><p>'+msg+'</p><p id="cd" style="color:var(--muted)"></p><div class="row">'+(last?'':'<button class="btn primary big" id="rNext">下一關</button>')+'<button class="btn big" id="rAgain">再玩一次</button><button class="btn big" id="rHome">回首頁</button></div>');
  speak(last?'全部過關了！你拿到'+st+'顆星星！':'過關了！拿到'+st+'顆星星！');

/* ================== 第1關：翻牌 ================== */
function stFlip(){
  const used=new Set(),pick=[];for(const c of shuffle(Object.keys(ZY))){if(!used.has(ZY[c])){used.add(ZY[c]);pick.push(c);}if(pick.length===6)break;}
  const cards=shuffle([...pick.map(c=>({k:c,zy:false,t:c,s:c+'，'+WORD[c]+'的'+c})),...pick.map(c=>({k:c,zy:true,t:ZY[c],s:SAY[ZY[c]]}))]);
  $('#qbox').innerHTML='<div class="qsub">翻開兩張牌：一張<b>生字</b>，一張<b>注音</b></div>';
  const ans=$('#ans');const g=document.createElement('div');g.className='flipgrid';ans.appendChild(g);
  const fit=()=>{const land=ans.clientWidth>ans.clientHeight;g.style.gridTemplateColumns='repeat('+(land?4:3)+',minmax(0,1fr))';g.style.gridTemplateRows='repeat('+(land?3:4)+',minmax(0,1fr))';};fit();
  let open=[],lock=false,matched=0;setProgress(0,6);
  const mascot=AV();
  cards.forEach(cd=>{const b=document.createElement('button');b.className='fcard';b.innerHTML='<div class="in"><div class="face back">'+mascot+'</div><div class="face front'+(cd.zy?' zy':'')+'">'+cd.t+'</div></div>';
    b.onclick=()=>{if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');tone(660,0,.06,'square',.04);speak(cd.s);open.push([b,cd]);
      if(open.length===2){lock=true;const[[b1,c1],[b2,c2]]=open;open=[];
        if(c1.k===c2.k&&c1.zy!==c2.zy){later(()=>{b1.classList.add('matched');b2.classList.add('matched');cheer(b2);matched++;setProgress(matched,6);lock=false;if(matched===6)later(()=>finishStage(G.mistakes<=3?3:G.mistakes<=7?2:1),1400);},650);}
        else{later(()=>{SFX.bad();b1.classList.remove('open');b2.classList.remove('open');G.mistakes++;lock=false;},1300);}}};
    g.appendChild(b);});
  G.readNow=()=>speak(STAGES[0].intro);
  if(G.introText){const t=G.introText;G.introText='';later(()=>speak(t),250);}
}

/* ================== 第3關：錯字打地鼠 ================== */
function stWhack(){
  const qs=shuffle(WRONG).slice(0,6);let i=0;
  const step=()=>{
    if(i>=qs.length)return finishStage();
    const q=qs[i],tk=G.token;clearAnims();setProgress(i,qs.length);
    const wi=q.s.indexOf(q.w);let taps=0,found=false,missed=false,lock=false;
    $('#qbox').innerHTML='<div class="qsub">哪一個字寫錯了？敲下去！</div>';
    const ans=$('#ans');ans.innerHTML='<div class="moles"></div><div class="fixzone"></div>';
    const ml=ans.querySelector('.moles'),fz=ans.querySelector('.fixzone');
    const moles=[...q.s].map((c,j)=>{const b=document.createElement('button');b.className='mole';b.textContent=c;
      b.onclick=()=>{if(found||lock)return;stopSpeech();
        if(j===wi){found=true;b.classList.add('hit');SFX.whack();later(()=>fix(),650);}
        else{lock=true;shake(b);SFX.bad();taps++;missed=true;later(()=>{lock=false;},700);
          if(taps>=3){moles[wi].classList.add('hint');speak('提示：是會發亮的那個字');}else speak(rnd(TRY));}};
      ml.appendChild(b);return b;});
    G.readNow=()=>speakSeq(['哪一個字寫錯了？',q.s]);
    const fix=()=>{const cq=mkQ('','要改成哪一個字？',q.o.map(charOpt),'');
      fz.innerHTML='<div class="qsub" style="text-align:center;color:var(--onbg)">「'+q.w+'」要改成哪一個字？</div><div class="fx2" style="flex:1;display:flex;flex-direction:column;min-height:150px"></div>';
      G.readNow=()=>speakSeq([q.w+'寫錯了，要改成哪一個字？',...cq.opts.map(o=>o.s)]);
      choices(fz.querySelector('.fx2'),cq,(res,tries,el)=>{
        if(res===true){moles[wi].textContent=q.a;moles[wi].classList.remove('hit','hint');moles[wi].classList.add('fixed');cheer(el);if(tries>0)missed=true;if(missed)G.mistakes++;
          speak(q.s.replace(q.w,q.a));later(()=>{i++;step();},2000);}
        else if(res===null){SFX.bad();speak(rnd(TRY));}
        else{SFX.bad();G.mistakes++;moles[wi].textContent=q.a;moles[wi].classList.add('fixed');speak('答案是：'+(DESC[q.a]||q.a)).then(()=>{if(tk!==G.token)return;later(()=>{i++;step();},700);});}
      });
      if(S.voice)later(()=>G.readNow(),200);checkFit();};
    if(S.voice||G.introText){const parts=readParts(['哪一個字寫錯了？',q.s]);later(()=>speakSeq(parts),250);}
    checkFit();
  };
  step();
}

/* ================== 第4關：部首合體 ================== */
function stRad(){
  const qs=shuffle(RADS).slice(0,6).map(([comp,word,ch,rad,opts])=>{
    const q=mkQ('<div class="qword" style="font-size:clamp(26px,min(7vw,5vh),44px)">'+word.replace(ch,'<span class="blank">？</span>')+'</div><div class="eq"><span class="bx" data-r>？</span>＋<span class="bx fill">'+comp+'</span>＝<span class="bx res">？</span></div>',
      word+'的'+ch+'，'+comp+'要加上哪一個部首？',opts.map(r=>({t:r,s:RN[r]||r})),RN[rad]+'加上'+comp+'，就是'+word+'的'+ch);
    q.ch=ch;q.rad=rad;q.word=word;return q;});
  const done=(q)=>{const bx=$('#qbox [data-r]'),res=$('#qbox .res');if(bx){bx.textContent=q.rad;bx.classList.add('fill');}
    if(res){res.textContent=q.ch;res.classList.add('fill','pop');}const bl=$('#qbox .blank');if(bl){bl.textContent=q.ch;}};
  runChoice(qs,{opt:{style:'card'},correct:(q)=>{done(q);later(()=>speak(q.word),300);},fail:(q)=>done(q),delay:2000,
    show:()=>{/* 部首卡片加上名稱 */later(()=>{document.querySelectorAll('#ans .card').forEach(c=>{const r=c.textContent;c.innerHTML='<span class="rad"><b>'+r+'</b><small>'+(RN[r]||'')+'</small></span>';});},0);}});
}

/* ================== 第5關：造詞接力賽 ================== */

/* ================== 第7關：句子小火車 ================== */
function stSort(){
  const qs=shuffle(SORTS).slice(0,4);let i=0;
  const step=()=>{
    if(i>=qs.length)return finishStage();

    const ans=$('#ans');ans.innerHTML='<div class="bank"></div>';const bank=ans.querySelector('.bank');
    let next=0,lock=false,missed=false,wrongHere=0;const btns=[];
    order.forEach(k=>{const b=document.createElement('button');b.className='piece';b.textContent=q.p[k];b.dataset.k=k;
      b.onclick=()=>{if(lock||b.classList.contains('used'))return;stopSpeech();
        if(k===next){b.classList.add('used');const c=document.createElement('span');c.className='car';c.textContent=q.p[k];$('#train').appendChild(c);SFX.pop();tone(523+next*90,0,.15);next++;wrongHere=0;
          if(next===q.p.length){cheer($('#train'));if(missed)G.mistakes++;lock=true;speak(q.f).then(()=>{if(tk!==G.token)return;later(()=>{i++;step();},600);});}
          else speak(q.p[k]);}
        else{lock=true;shake(b);SFX.bad();missed=true;wrongHere++;later(()=>{lock=false;},800);
          if(wrongHere>=2){const t=btns.find(x=>+x.dataset.k===next);t&&t.classList.add('reveal');speak('提示：是發亮的那一塊');}else speak('不是這一塊，再聽一次：'+q.f);}};
      bank.appendChild(b);btns.push(b);});
    G.readNow=()=>speak('把句子排好：'+q.f);
    if(S.voice||G.introText){const parts=readParts(['把句子排好：'+q.f]);later(()=>speakSeq(parts),250);}
    checkFit();

}

function startGroup(nt,per){

  const board=()=>{$('#stageTop').innerHTML='<div class="teams">'+G.group.score.map((s,k)=>'<span class="team t'+k+'" id="tm'+k+'">'+TEAMS[k]+' ⭐'+s+'</span>').join('')+'</div>';};
  board();let i=0;
  const step=()=>{if(i>=qs.length)return groupEnd();const q=qs[i],t=i%nt,tk=G.token;clearAnims();setProgress(Math.floor(i/nt),per);
    document.querySelectorAll('.team').forEach((e,k)=>e.classList.toggle('on',k===t));
    $('#qbox').innerHTML='<div class="qsub" style="color:var(--accent)">輪到'+TEAMS[t]+'</div>'+q.html;

    choices($('#ans'),q,(res,tries,el)=>{
      if(res===true){SFX.ok();burst(el.getBoundingClientRect().left+el.getBoundingClientRect().width/2,el.getBoundingClientRect().top,45);popWord(TEAMS[t]+'得分！');G.group.score[t]++;board();document.querySelectorAll('.team').forEach((e,k)=>e.classList.toggle('on',k===t));const tm=$('#tm'+t);tm.classList.add('bump');later(()=>{i++;step();},1600);}
      else{SFX.bad();speak('答案是：'+q.opts[q.ans].s).then(()=>{if(tk!==G.token)return;later(()=>{i++;step();},700);});}
    },{maxTries:1});
    const parts=['輪到'+TEAMS[t]+'。',q.say,...q.opts.map(o=>o.s)];later(()=>speakSeq(S.voice?parts:[parts[0]]),250);checkFit();};
  step();
}

function stylePanel(){
  const desc={wheel:'答案坐在慢慢轉的摩天輪上',claw:'點答案，夾子會把它夾起來',card:'最簡單的大按鈕，適合剛開始玩'};
  const o=overlay('<h3>答題方式（老師設定）</h3><p>選擇題的答案要用哪一種方式出現？</p><div class="row" style="flex-direction:column">'+Object.entries(STYLES).map(([k,v])=>'<button class="opt'+(S.style===k?' on':'')+'" data-k="'+k+'">'+v+'<br><small>'+desc[k]+'</small></button>').join('')+'</div><p style="font-size:14px;color:var(--muted)">答案字太長時，會自動改用大按鈕。</p><div class="row"><button class="btn big" id="stX">關閉</button></div>');
  o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.style=b.dataset.k;saveS();closeOverlay();renderHome();speak('答題方式：'+STYLES[S.style]);});
  o.querySelector('#stX').onclick=closeOverlay;
}
function backupPanel(){
  let code='';try{code='PD61:'+btoa(unescape(encodeURIComponent(JSON.stringify(R))));}catch(e){}
  const o=overlay('<h3>紀錄備份</h3><p>把下面這串代碼複製起來，貼到 LINE 或記事本保存。換手機或清除資料後，可以貼回來還原。</p><textarea id="bkOut" readonly>'+code+'</textarea><div class="row"><button class="btn primary" id="bkCopy">複製代碼</button></div><p style="margin-top:14px">還原紀錄：把代碼貼在這裡</p><textarea id="bkIn" placeholder="貼上 PD61: 開頭的代碼"></textarea><div class="row"><button class="btn primary" id="bkLoad">還原</button><button class="btn big" id="bkX">關閉</button></div><p id="bkMsg"></p>');
  o.querySelector('#bkCopy').onclick=()=>{const ta=o.querySelector('#bkOut');const done=()=>{o.querySelector('#bkMsg').textContent='已複製！';};
    try{navigator.clipboard.writeText(code).then(done,()=>{ta.select();o.querySelector('#bkMsg').textContent='請長按代碼，選「全選」再複製。';});}catch(e){ta.select();o.querySelector('#bkMsg').textContent='請長按代碼，選「全選」再複製。';}};
  o.querySelector('#bkLoad').onclick=()=>{const v=o.querySelector('#bkIn').value.trim();const msg=o.querySelector('#bkMsg');
    try{if(!v.startsWith('PD61:'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));if(!d.players)throw 0;
      Object.entries(d.players).forEach(([n,p])=>{const cur=R.players[n]||(R.players[n]={lv:{}});Object.entries(p.lv||{}).forEach(([k,r])=>{if(!cur.lv[k]||cur.lv[k].s<r.s)cur.lv[k]=r;});});
      if(d.cur)R.cur=d.cur;saveR();msg.textContent='還原成功！';renderHome();}catch(e){msg.textContent='代碼不正確，請確認有完整貼上。';}};
  o.querySelector('#bkX').onclick=closeOverlay;
}
$('#btnPlayer').onclick=()=>{nav();renderStart();show('start');introAt=1;speak('寫下你的名字，選一個角色，再按開始闖關。');};$('#btnStyle').onclick=stylePanel;$('#btnBackup').onclick=backupPanel;$('#btnGroup').onclick=groupSetup;

/* ================== 遊戲畫面工具列 ================== */
$('#btnHome').onclick=goHome;
$('#btnRead').onclick=()=>{G.readNow&&G.readNow();};
const rateName=()=>S.rate<=.6?'很慢':S.rate<=.8?'慢':S.rate<=1?'普通':S.rate<=1.2?'快':'很快';
$('#btnSlow').onclick=()=>{S.rate=Math.max(.5,+(S.rate-.15).toFixed(2));saveS();toast('語速：'+rateName());speak('我會唸慢一點');};
$('#btnFast').onclick=()=>{S.rate=Math.min(1.4,+(S.rate+.15).toFixed(2));saveS();toast('語速：'+rateName());speak('我會唸快一點');};
$('#btnVoice').onclick=()=>{S.voice=!S.voice;saveS();voiceLabel();if(S.voice){speak('好，我會唸給你聽').then(()=>{G.readNow&&G.readNow();});}else{stopSpeech();toast('語音說明關掉了，需要時可以點「唸題目」');}};
addEventListener('resize',checkFit);
</script>
